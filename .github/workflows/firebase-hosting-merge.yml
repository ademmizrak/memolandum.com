# Superseded by deploy-app.yml — disabled to avoid duplicate deploys.
name: Deploy to Firebase Hosting on merge
on:
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      MEMOLANDUM_SLIM_APP: "1"
      NEXT_PUBLIC_DATA_BASE_URL: https://storage.googleapis.com/memolandum-33dc4.firebasestorage.app/data
      NEXT_PUBLIC_ASSETS_BASE_URL: https://storage.googleapis.com/memolandum-33dc4.firebasestorage.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run deploy:app:build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEMOLANDUM_33DC4 }}
          channelId: live
          projectId: memolandum-33dc4
