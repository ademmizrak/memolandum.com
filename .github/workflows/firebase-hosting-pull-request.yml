name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      MEMOLANDUM_SLIM_APP: "1"
      NEXT_PUBLIC_DATA_BASE_URL: https://storage.googleapis.com/memolandum-33dc4.firebasestorage.app/data
      NEXT_PUBLIC_ASSETS_BASE_URL: https://storage.googleapis.com/memolandum-33dc4.firebasestorage.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run deploy:app:build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEMOLANDUM_33DC4 }}
          projectId: memolandum-33dc4
