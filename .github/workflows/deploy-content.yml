# Content → GCS checksum delta (Hosting'e dokunmaz)
name: deploy-content

on:
  workflow_dispatch:

jobs:
  deploy_content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEMOLANDUM_33DC4 }}
      - name: GCS delta sync
        run: npm run deploy:content
